# https://goreleaser.com — run by .github/workflows/release.yml on v* tags.
version: 2

project_name: zincsearch
before:
  hooks:
    - go mod tidy

builds:
  - id: zincsearch_binaries
    ldflags:
      - -s -w
      - -X github.com/zincsearch/zincsearch/pkg/meta.Version={{.Version}}
      - -X github.com/zincsearch/zincsearch/pkg/meta.BuildDate={{.Date}}
      - -X github.com/zincsearch/zincsearch/pkg/meta.CommitHash={{.Commit}}
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - windows
      - darwin
      - freebsd
      - openbsd
    goarch:
      - amd64
      - arm
      - arm64
    goarm:
      - "6"
      - "7"
    main: ./cmd/zincsearch/main.go

archives:
  - id: zincsearch
    name_template: >-
      {{- .ProjectName }}_
      {{- .Version }}_
      {{- .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}
      {{- if .Arm }}v{{ .Arm }}{{ end -}}

checksum:
  name_template: "checksums.txt"

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"

dockers_v2:
  - id: zincsearch
    ids:
      - zincsearch_binaries
    dockerfile: docker/Dockerfile.release
    images:
      - ghcr.io/zincsearch/zincsearch
    tags:
      - "{{ .Version }}"
      - latest
    platforms:
      - linux/amd64
      - linux/arm64
      - linux/arm/v7
    labels:
      "org.opencontainers.image.created": "{{ .Date }}"
      "org.opencontainers.image.revision": "{{ .FullCommit }}"
      "org.opencontainers.image.version": "{{ .Version }}"
      "org.opencontainers.image.source": "{{ .GitURL }}"

# https://goreleaser.com/customization/homebrew_casks/
homebrew_casks:
  - name: zincsearch
    repository:
      owner: zinclabs
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    # Cask is only pushed when the HOMEBREW_TAP_GITHUB_TOKEN secret is configured.
    skip_upload: "{{ if .Env.HOMEBREW_TAP_GITHUB_TOKEN }}false{{ else }}true{{ end }}"
    binaries: [zincsearch]
    homepage: "https://github.com/zincsearch/zincsearch"
    description: |
      ZincSearch is a search engine that does full text indexing. It is a lightweight
      alternative to elasticsearch that requires significantly less resources. It uses
      bluge as the underlying indexing library.
    license: "Apache-2.0"
    hooks:
      post:
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/zincsearch"]
          end
